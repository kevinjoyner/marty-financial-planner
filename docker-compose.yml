services:
  app:
    image: ghcr.io/kevinjoyner/marty-financial-planner:staging
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=sqlite:////data/marty.db
    volumes:
      - marty_data:/data
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

volumes:
  marty_data:
